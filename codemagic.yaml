workflows:
  android_webview_verify:
    name: GraFit Android WebView Verify
    environment:
      java: 21
      vars:
        GRADLE_OPTS: >-
          -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Build reproducible release APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean app:assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk

  android_webview_release:
    name: GraFit Android WebView Release
    environment:
      java: 21
      groups:
        - keystore
      vars:
        GRADLE_OPTS: >-
          -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Decode keystore
        script: |
          printf '%s' "$CM_KEYSTORE" | tr -d '\r\n ' | base64 --decode > app/keystore.jks

      - name: Verify keystore
        script: |
          test -s app/keystore.jks
          ls -l app/keystore.jks

      - name: Build signed APK
        script: |
          chmod +x ./gradlew
          KEYSTORE_PATH="$PWD/app/keystore.jks"
          ./gradlew --no-daemon clean \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD" \
            app:assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
  grafit_ios_verify:
    name: GraFit iOS Verify
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Verify iOS build and core tests
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-webview-app"
          bash verify-on-mac.sh

      - name: Build unsigned iPhone app
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios-webview-app"
          xcodebuild \
            -project GraFitWebView.xcodeproj \
            -scheme GraFitWebView \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios-build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
